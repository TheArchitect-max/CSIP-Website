<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Continuum State Integrity Platform</title>
  <desc id="desc">Dark editorial social card with an abstract illuminated integrity ring.</desc>
  <defs>
    <radialGradient id="light" cx="72%" cy="45%" r="42%">
      <stop offset="0" stop-color="#d7aa5b" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#a67a38" stop-opacity=".1"/>
      <stop offset="1" stop-color="#090908" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#f3efe5"/>
      <stop offset="1" stop-color="#f0dba7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#090908"/>
  <rect width="1200" height="630" fill="url(#light)"/>
  <g fill="none" transform="translate(900 310)">
    <circle r="178" stroke="#d7aa5b" stroke-opacity=".18" stroke-width="2"/>
    <ellipse rx="150" ry="82" stroke="#f0dba7" stroke-opacity=".44" stroke-width="2" transform="rotate(-24)"/>
    <ellipse rx="150" ry="82" stroke="#d7aa5b" stroke-opacity=".28" stroke-width="2" transform="rotate(31)"/>
    <circle r="46" stroke="#f0dba7" stroke-opacity=".5" stroke-width="2"/>
    <circle r="8" fill="#f0dba7" stroke="none"/>
  </g>
  <text x="96" y="168" fill="#d7aa5b" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="5">CONTINUUM</text>
  <text x="96" y="260" fill="url(#titleGrad)" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">State Integrity Platform</text>
  <text x="96" y="345" fill="#b9b3a5" font-family="Arial, Helvetica, sans-serif" font-size="30">Verifiable state. Reproducible execution.</text>
  <text x="96" y="520" fill="#777267" font-family="Arial, Helvetica, sans-serif" font-size="20">A TheArchitectMax project · Public showcase</text>
</svg>
